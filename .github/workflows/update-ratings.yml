name: Update NFL team ratings

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * 2"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas

      - name: Generate NFL ratings
        run: python build_ratings.py

      - name: Save updated ratings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add team_ratings.csv team_ratings_audit.csv
          git diff --cached --quiet || (git commit -m "Update NFL team ratings" && git push)
